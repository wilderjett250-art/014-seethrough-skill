name: Build Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable Windows EXE
        run: npm run build:win

      - name: Package ready-to-run ZIP
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: npm run package:release

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = Get-ChildItem -LiteralPath dist -Filter "seethrough-skill-windows-x64-*.zip" | Select-Object -First 1
          if (-not $asset) {
            throw "Release ZIP was not created."
          }
          $tag = "${{ github.ref_name }}"
          gh release view $tag 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset.FullName --clobber
          } else {
            gh release create $tag $asset.FullName --title "SeeThrough Skill $tag" --generate-notes
          }
